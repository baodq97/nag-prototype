name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      # The browser install needs the pinned Playwright from the lockfile.
      - name: Install Playwright browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run checks
        run: bash scripts/ci.sh
